[package]
name = "maskrun"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Run commands with secrets from your OS keyring, without leaking them into an AI agent's context."
license = "GPL-3.0-or-later"
default-run = "maskrun"
repository = "https://github.com/furkanakyol/maskrun"
readme = "README.md"
keywords = ["secrets", "keyring", "ai-agent", "claude-code", "dotenv"]
categories = ["command-line-utilities", "development-tools", "authentication"]
exclude = [".github/", "tests/", "integrations/", "README.*.md", "install.sh", "install.ps1", "Makefile"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: rewriting a user's settings.json (install-guard) must not reorder its keys.
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
percent-encoding = "2"
zeroize = "1"
rpassword = "7"
# Raw mode, key events, alternate screen and ANSI colour for the bare-`maskrun`
# TUI. Not `ratatui`: a two-pane list/detail view needs none of its layout
# engine, and every extra crate here is one more thing to read in a tool whose
# whole job is handling secrets.
crossterm = "0.28"
# `default-features = false` drops the `image-data` feature (png/tiff/jpeg
# decoders this tool never needs for clipboard text). `wayland-data-control`
# talks the Wayland clipboard protocol directly instead of falling back to
# XWayland-only X11 support, matching why arboard was chosen over shelling out
# to `wl-copy`/`xclip` in the first place — see keyring.rs's precedent for
# picking a direct-protocol crate over a CLI dependency.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# Not `keyring`: its Secret Service store uses service+username, not
# service+name (see keyring.rs). Plain, not Dh, skips a ~30-crate DH stack.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = "4"

# Security.framework's generic-password API — value never touches argv.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# Pinned to the minor version security-framework itself resolves to (see
# Cargo.lock): CFData has to be the same type on both sides of the call.
core-foundation = "0.10"

# Credential Manager — see keyring.rs for why, replacing the Python DPAPI files.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"


